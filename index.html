<!DOCTYPE html>
<html lang="en" class="fonts-pending">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Your Studio</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=lightbulb_2"
    />
    <script type="module">
      import "/src/styles/colors.css";
    </script>
    <!--
      Hard rule: never paint text until original fonts are loaded via FontFace.
      Video may start earlier; text appears only with Cormorant + Outfit.
    -->
    <script>
      (function () {
        var path = location.pathname || "/";
        window.__IS_HOME =
          path === "/" || path === "/index.html" || path === "";

        var mobile = window.matchMedia("(max-width: 900px)").matches;
        window.__HERO_VIDEO_HREF = mobile
          ? "/media/scrub-mobile-auto.mp4"
          : "/media/scrub.mp4";

        window.__markFontsReady = function () {
          if (document.documentElement.classList.contains("fonts-ready")) return;
          document.documentElement.classList.remove("fonts-pending");
          document.documentElement.classList.add("fonts-ready");
          var copy = document.getElementById("hero-early-copy");
          if (copy) {
            copy.hidden = false;
            requestAnimationFrame(function () {
              copy.classList.add("is-visible");
            });
          }
        };

        function originalsReady() {
          if (!document.fonts || !document.fonts.check) return false;
          return (
            document.fonts.check('400 48px "Cormorant Garamond"') &&
            document.fonts.check('500 48px "Cormorant Garamond"') &&
            document.fonts.check('italic 400 48px "Cormorant Garamond"') &&
            document.fonts.check('300 16px "Outfit"') &&
            document.fonts.check('400 16px "Outfit"')
          );
        }

        window.__loadSiteFonts = function () {
          if (window.__fontsLoading) return;
          window.__fontsLoading = true;

          var faces = [
            {
              family: "Cormorant Garamond",
              source: 'url("/fonts/cormorant-400.woff2") format("woff2")',
              descriptors: { weight: "400", style: "normal", display: "block" },
            },
            {
              family: "Cormorant Garamond",
              source: 'url("/fonts/cormorant-500.woff2") format("woff2")',
              descriptors: { weight: "500", style: "normal", display: "block" },
            },
            {
              family: "Cormorant Garamond",
              source: 'url("/fonts/cormorant-italic-400.woff2") format("woff2")',
              descriptors: { weight: "400", style: "italic", display: "block" },
            },
            {
              family: "Outfit",
              source: 'url("/fonts/outfit-300.woff2") format("woff2")',
              descriptors: { weight: "300", style: "normal", display: "block" },
            },
            {
              family: "Outfit",
              source: 'url("/fonts/outfit-400.woff2") format("woff2")',
              descriptors: { weight: "400", style: "normal", display: "block" },
            },
            {
              family: "Outfit",
              source: 'url("/fonts/outfit-500.woff2") format("woff2")',
              descriptors: { weight: "500", style: "normal", display: "block" },
            },
          ];

          if (typeof FontFace === "undefined" || !document.fonts) {
            // Ancient browsers only: stylesheet + long delay
            var sheet = document.createElement("link");
            sheet.rel = "stylesheet";
            sheet.href = "/fonts/fonts.css";
            sheet.onload = function () {
              setTimeout(window.__markFontsReady, 100);
            };
            document.head.appendChild(sheet);
            return;
          }

          Promise.all(
            faces.map(function (def) {
              var face = new FontFace(def.family, def.source, def.descriptors);
              return face.load().then(function (loaded) {
                document.fonts.add(loaded);
                return loaded;
              });
            })
          )
            .then(function () {
              // Only reveal when the browser confirms the real faces
              var tries = 0;
              (function confirm() {
                if (originalsReady()) {
                  window.__markFontsReady();
                  return;
                }
                if (tries++ < 40) {
                  setTimeout(confirm, 50);
                  return;
                }
                // Still not confirmed — do NOT flash a substitute; leave text hidden
                console.warn("[fonts] original faces not confirmed");
              })();
            })
            .catch(function (err) {
              console.warn("[fonts] load failed", err);
            });
        };

        // Start fonts ASAP (tiny files). Video still kicks in body first paint.
        if (!window.__IS_HOME) {
          window.__loadSiteFonts();
        }
      })();
    </script>
    <style>
      html,
      body {
        margin: 0;
        background: var(--ink);
      }

      /* Hide ALL text until original fonts are confirmed */
      html.fonts-pending :is(
          h1,
          h2,
          h3,
          h4,
          h5,
          h6,
          p,
          a,
          span,
          li,
          button,
          label,
          nav,
          em,
          strong,
          small
        ) {
        color: transparent !important;
        -webkit-text-fill-color: transparent !important;
        text-shadow: none !important;
      }
      html.fonts-pending #hero-early-copy {
        opacity: 0 !important;
        visibility: hidden !important;
      }

      #hero-early-video {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center center;
        z-index: 2;
        background: var(--ink) url("/media/posters/01.jpg") center / cover no-repeat;
        pointer-events: none;
      }
      #hero-early-copy {
        position: fixed;
        inset: 0;
        z-index: 3;
        display: grid;
        place-items: center;
        text-align: center;
        padding: 5rem 1.35rem;
        pointer-events: none;
        color: #fff;
        opacity: 0;
        transition: opacity 0.35s ease;
      }
      html.fonts-ready #hero-early-copy.is-visible {
        opacity: 1;
      }
      #hero-early-copy[hidden] {
        display: none !important;
      }
      #hero-early-copy h1 {
        margin: 0;
        font-family: "Cormorant Garamond";
        font-weight: 500;
        font-size: clamp(2.85rem, 12vw, 4.4rem);
        line-height: 0.95;
        letter-spacing: -0.035em;
        max-width: 10ch;
        text-shadow:
          0 0 1px rgba(0, 0, 0, 0.55),
          0 2px 4px rgba(0, 0, 0, 0.55),
          0 10px 28px rgba(0, 0, 0, 0.45);
      }
      #hero-early-copy h1 em {
        font-style: italic;
        font-weight: 400;
        color: var(--gold-bright);
      }
      #hero-early-copy p {
        margin: 1.05rem auto 0;
        max-width: 28ch;
        font-family: "Outfit";
        font-size: 1.05rem;
        font-weight: 300;
        line-height: 1.55;
        color: #fff8ef;
        text-shadow:
          0 0 1px rgba(0, 0, 0, 0.55),
          0 2px 5px rgba(0, 0, 0, 0.5),
          0 12px 28px rgba(0, 0, 0, 0.4);
      }
      #root {
        position: relative;
        z-index: 1;
      }
      html.hero-adopted #hero-early-copy {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <video
      id="hero-early-video"
      muted
      playsinline
      webkit-playsinline
      autoplay
      loop
      preload="auto"
      poster="/media/posters/01.jpg"
      fetchpriority="high"
      disablepictureinpicture
      hidden
    ></video>
    <div id="hero-early-copy" hidden>
      <div>
        <h1>Light, timing,<br /><em>instinct</em></h1>
        <p>The best shots aren't planned — they're seen a second before they happen.</p>
      </div>
    </div>
    <script>
      (function () {
        var v = document.getElementById("hero-early-video");
        var copy = document.getElementById("hero-early-copy");
        if (!v) return;

        if (!window.__IS_HOME) {
          v.remove();
          if (copy) copy.remove();
          window.__HERO_EARLY_VIDEO = null;
          return;
        }

        v.hidden = false;
        window.__HERO_EARLY_VIDEO = v;
        v.muted = true;
        v.defaultMuted = true;
        v.playsInline = true;
        v.setAttribute("playsinline", "");
        v.setAttribute("webkit-playsinline", "");
        v.preload = "auto";
        v.src = window.__HERO_VIDEO_HREF;
        try {
          v.load();
        } catch (e) {}
        var play = v.play();
        if (play && play.catch) play.catch(function () {});

        // Video request started — now load original fonts (small local files)
        if (window.__loadSiteFonts) window.__loadSiteFonts();
      })();
    </script>

    <div id="root"></div>
    <script type="module">
      (function () {
        var booted = false;
        function bootApp() {
          if (booted) return;
          booted = true;
          import("/src/main.jsx");
        }

        if (!window.__IS_HOME) {
          bootApp();
          return;
        }

        var v = document.getElementById("hero-early-video");
        if (v) {
          v.addEventListener("loadstart", bootApp, { once: true });
          v.addEventListener("progress", bootApp, { once: true });
          v.addEventListener("loadeddata", bootApp, { once: true });
        }
        setTimeout(bootApp, 700);
      })();
    </script>

    <script type="text/javascript">
      var Tawk_API = Tawk_API || {},
        Tawk_LoadStart = new Date();
      // Keep chat bubble only — never auto-open the conversation panel
      Tawk_API.onLoad = function () {
        try {
          Tawk_API.minimize();
        } catch (e) {}
        // Welcome-message triggers sometimes maximize after load — close those too
        setTimeout(function () {
          try {
            Tawk_API.minimize();
          } catch (e) {}
        }, 800);
      };
      (function () {
        function loadTawk() {
          var s1 = document.createElement("script"),
            s0 = document.getElementsByTagName("script")[0];
          s1.async = true;
          s1.src = "https://embed.tawk.to/6a6ec413be39691d4f4b3ccb/1jv0arr9m";
          s1.charset = "UTF-8";
          s1.setAttribute("crossorigin", "*");
          s0.parentNode.insertBefore(s1, s0);
        }
        function whenIdle(fn) {
          if ("requestIdleCallback" in window) {
            requestIdleCallback(fn, { timeout: 8000 });
          } else {
            setTimeout(fn, 5000);
          }
        }
        window.addEventListener("load", function () {
          whenIdle(loadTawk);
        });
      })();
    </script>
  </body>
</html>
